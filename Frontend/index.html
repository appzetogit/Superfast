<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=3" />
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png?v=3" />
  <link rel="shortcut icon" href="/favicon.ico?v=3" />
  <link rel="apple-touch-icon" href="/favicon.png?v=3" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Non-blocking font load: a slow Google Fonts request must not keep the screen white -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@400;500;600;700&display=swap"
    rel="stylesheet" media="print" onload="this.media='all'">
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  </noscript>
  <meta name="theme-color" content="#FDF4EC" />
  <style>
    html, body { margin: 0; background: #FDF4EC; }
    #boot-loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: #FDF4EC; font-family: system-ui, -apple-system, sans-serif; color: #6b7280; font-size: 14px; font-weight: 600; }
    #boot-loader i { width: 40px; height: 40px; border-radius: 50%; border: 4px solid #fed7aa; border-top-color: #f97316; animation: boot-spin .8s linear infinite; }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
  </style>
  <title>Superfast</title>
</head>

<body>
  <!-- Shown instantly, before any JS loads; React replaces it on first render -->
  <div id="root"><div id="boot-loader"><i></i><span>Loading...</span></div></div>
  <script type="module" src="/src/index.jsx"></script>
</body>

</html>
